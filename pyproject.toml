[project]
name = "yt-stock-analysis"
version = "0.1.0"
description = "Daily pipeline that discovers popular stock-market YouTube videos, pulls transcripts, and extracts structured analysis with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shuaidong Pan" }]
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "typer>=0.12",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.8",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
mlx = ["mlx-whisper>=0.4"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ytstock = "ytstock.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytstock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ytstock.*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
